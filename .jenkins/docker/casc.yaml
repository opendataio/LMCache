jenkins:
  systemMessage: "LMCache RBLN CI Demo"
  numExecutors: 2

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

# Credentials are configured via Jenkins UI:
# Manage Jenkins -> Credentials -> Add Credential
#   Kind:   Secret text
#   ID:     GITHUB_PAT
#   Secret: <your GitHub PAT with repo:status and public_repo scopes>
